upstream prediction_api {
    server prediction-api:8000;
}

upstream training_api {
    server training-api:8001;
}

server {
    listen 80;

    # GET /predict, GET /features -> prediction-api
    location /predict {
        proxy_pass http://prediction_api;
        proxy_set_header Host $host;
    }

    location /features {
        proxy_pass http://prediction_api;
        proxy_set_header Host $host;
    }

    # POST /train -> training-api
    location /train {
        proxy_pass http://training_api;
        proxy_set_header Host $host;
    }

    location / {
        default_type text/plain;
        return 200 "Immo_MLOps reverse proxy - routes: /predict, /features, /train\n";
    }
}
