# --- Rate limiting ---
# Zone partagee : 10 Mo (~160 000 IP trackees), 10 requetes/seconde autorisees
# par IP en moyenne, avec un burst absorbe en file d'attente (voir plus bas).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# --- Load balancing ---
# prediction-api est deploye en 2 instances (prediction-api-1, prediction-api-2,
# cf. docker-compose.yaml). Nginx repartit les requetes entre les deux en
# round-robin (comportement par defaut d'un bloc upstream a plusieurs "server").
upstream prediction_api {
    server prediction-api-1:8000;
    server prediction-api-2:8000;
}

upstream training_api {
    server training-api:8001;
}

server {
    listen 80;

    # GET /predict, GET /features -> prediction-api (load balance sur 2 instances)
    location /predict {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://prediction_api;
        proxy_set_header Host $host;
    }

    location /features {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://prediction_api;
        proxy_set_header Host $host;
    }

    # POST /train -> training-api (pas de load balancing : entrainement lourd,
    # une seule instance a la fois evite de dupliquer un travail couteux)
    location /train {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://training_api;
        proxy_set_header Host $host;
    }

    location / {
        default_type text/plain;
        return 200 "Immo_MLOps reverse proxy - routes: /predict, /features, /train\n";
    }
}
